name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_skillvet.py
      - name: Clean fixture must pass, malicious must fail
        run: |
          python3 skillvet.py ./examples/clean-skill/
          if python3 skillvet.py ./examples/malicious-skill/ --fail-on critical; then
            echo "ERROR: malicious fixture was NOT flagged"; exit 1
          else
            echo "OK: malicious fixture flagged (nonzero exit as expected)"
          fi

  sarif:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 skillvet.py ./examples/clean-skill/ --sarif skillvet.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillvet.sarif
