[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ruslanlap-skill-vet"
version = "0.2.2"
description = "Vet AI agent skills before your agent runs them"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
skillvet = "skillvet:main"

[project.urls]
Homepage = "https://github.com/ruslanlap/skill-vet"
Repository = "https://github.com/ruslanlap/skill-vet"
Issues = "https://github.com/ruslanlap/skill-vet/issues"

[tool.setuptools]
py-modules = ["skillvet"]
